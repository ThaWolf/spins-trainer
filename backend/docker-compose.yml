version: '3.8'

services:
  spins_trainer:
    container_name: spins_trainer
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env.development
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: always

  postgres_db:
    image: postgres:14
    container_name: postgres_spins_trainer
    restart: always
    env_file:
      - .env.production
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
